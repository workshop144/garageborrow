packages:
  - "apps/*"
  - "packages/*"
  # CI-only tooling (Lighthouse). deploy.yml installs with --filter '!./tools/*'.
  - "tools/*"

# Matches the Dependabot cooldown (ADR-089): a release must be 3 days old before
# pnpm resolves it. Minutes. Also enforced on `pnpm install --frozen-lockfile`
# in CI, so a Dependabot security bump younger than 3 days fails CI. For an
# urgent CVE fix, add the package to a `minimumReleaseAgeExclude:` list here in
# the same PR and remove it once the release is older than 3 days.
minimumReleaseAge: 4320

# pnpm 10+ runs no dependency lifecycle scripts unless listed here. A new native
# dependency that needs its install script must be added, or install fails with
# ERR_PNPM_IGNORED_BUILDS. sharp is left out on purpose: it loads from the
# prebuilt @img/* optional deps.
allowBuilds:
  esbuild: true

peerDependencyRules:
  allowedVersions:
    # eslint-plugin-react 7.37.x declares eslint <=9 but works on 10.
    eslint-plugin-react>eslint: "10"

# Security overrides for transitive dev/build dependencies (Dependabot alerts on
# main, 2026-11-06). Each one moves only the vulnerable range to the first fixed
# line that is older than minimumReleaseAge. Remove an entry once its parent
# depends on a fixed version itself.
overrides:
  # GHSA-g3hv-75wg-m249 (globparts amplification): eslint's config-array and
  # glob pull minimatch 10.x; no 10.x fix exists, 11.0.1+ is fixed.
  "minimatch@>=7.0.0 <11.0.1": ^11.0.1
  # GHSA-3g3m-2fjr-6pw4 (abort does not stop the walk): workbox-build (glob 11)
  # and @sentry/bundler-plugins (glob 13); fixed in 14.0.2.
  "glob@>=9.0.0 <14.0.2": ^14.0.2
  # GHSA-rj75-hqrm-r3gf (quadratic flat selector parse): @tailwindcss/typography
  # pins 6.0.10 exactly; 6.1.5 is the fixed 6.x release.
  "postcss-selector-parser@<6.1.5": ^6.1.5
