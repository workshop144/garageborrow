name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  deploy:
    # Production AWS (OIDC deploy role, garageborrow-prod stack) is not set up
    # for this repo yet. Set the repo variable DEPLOY_ENABLED=true once the
    # AWS_DEPLOY_ROLE_ARN secret exists; until then the job is skipped.
    if: vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build
        env:
          # Per-deployment identity lives in repository variables, not in code.
          VITE_TENANT_NAME: ${{ vars.TENANT_NAME }}
          VITE_SITE_URL: ${{ vars.SITE_URL }}
          VITE_TIMEZONE: ${{ vars.APP_TIMEZONE }}
          VITE_TENANT_GOVERNING_LAW: ${{ vars.TENANT_GOVERNING_LAW }}
          VITE_TENANT_VENUE: ${{ vars.TENANT_VENUE }}
          VITE_GARAGE_SLUG: ${{ vars.GARAGE_SLUG }}

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-2

      - name: Setup SAM
        uses: aws-actions/setup-sam@f84ec7d548307efafe33230528756de3c5841a17 # v2
        with:
          use-installer: true

      - name: SAM build
        run: sam build --template infra/template.yaml

      - name: SAM deploy
        run: |
          sam deploy \
            --stack-name garageborrow-prod \
            --region us-east-2 \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset \
            --capabilities CAPABILITY_IAM CAPABILITY_AUTO_EXPAND \
            --parameter-overrides Stage=prod \
              "SiteUrl=${{ vars.SITE_URL }}" \
              "TenantName=${{ vars.TENANT_NAME || 'Garage Borrow' }}" \
              "AppTimezone=${{ vars.APP_TIMEZONE || 'America/New_York' }}"
