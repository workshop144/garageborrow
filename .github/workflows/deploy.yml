name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build
        env:
          # Per-deployment identity lives in repository variables, not in code.
          VITE_TENANT_NAME: ${{ vars.TENANT_NAME }}
          VITE_SITE_URL: ${{ vars.SITE_URL }}
          VITE_TIMEZONE: ${{ vars.APP_TIMEZONE }}
          VITE_TENANT_GOVERNING_LAW: ${{ vars.TENANT_GOVERNING_LAW }}
          VITE_TENANT_VENUE: ${{ vars.TENANT_VENUE }}
          VITE_GARAGE_SLUG: ${{ vars.GARAGE_SLUG }}

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-2

      - name: Setup SAM
        uses: aws-actions/setup-sam@v2
        with:
          use-installer: true

      - name: SAM build
        run: sam build --template infra/template.yaml

      - name: SAM deploy
        run: |
          sam deploy \
            --stack-name garageborrow-prod \
            --region us-east-2 \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset \
            --capabilities CAPABILITY_IAM CAPABILITY_AUTO_EXPAND \
            --parameter-overrides Stage=prod \
              "SiteUrl=${{ vars.SITE_URL }}" \
              "TenantName=${{ vars.TENANT_NAME || 'Garage Borrow' }}" \
              "AppTimezone=${{ vars.APP_TIMEZONE || 'America/New_York' }}"
