name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# Read-only by default. Only the deploy job below can mint an OIDC token, and
# that job runs no repo or dependency code (S4-3, PR #46 review).
permissions:
  contents: read

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  build:
    # Production AWS (OIDC deploy role, garageborrow-prod stack) is not set up
    # for this repo yet. Set the repo variable DEPLOY_ENABLED=true once the
    # AWS_DEPLOY_ROLE_ARN secret exists; until then both jobs are skipped.
    if: vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Everything that installs or runs dependency code happens here: no
    # id-token permission and no production environment, so no step (and no
    # install script or build plugin) can request the deploy role's OIDC token.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Deploy never pushes; keep the token out of .git/config.
          persist-credentials: false

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        # CI-only tooling under tools/ (Lighthouse and its ~70 packages) stays
        # out of the deploy build.
        run: pnpm install --frozen-lockfile --filter '!./tools/*'

      - name: Build
        run: pnpm build
        env:
          # Per-deployment identity lives in repository variables, not in code.
          VITE_TENANT_NAME: ${{ vars.TENANT_NAME }}
          VITE_SITE_URL: ${{ vars.SITE_URL }}
          VITE_TIMEZONE: ${{ vars.APP_TIMEZONE }}
          VITE_TENANT_GOVERNING_LAW: ${{ vars.TENANT_GOVERNING_LAW }}
          VITE_TENANT_VENUE: ${{ vars.TENANT_VENUE }}
          VITE_GARAGE_SLUG: ${{ vars.GARAGE_SLUG }}

      - name: Check Lambda runtime imports
        # Fails while any bundle imports a module the Lambda will not have
        # (today: sharp in the image resizer, no layer yet), so a broken
        # function is never deployed. See STATE.md.
        run: node scripts/check-lambda-externals.mjs

      - name: Setup SAM
        uses: aws-actions/setup-sam@341eee193f458fa5aae5d52c94b0c5cf3a1c5a52 # v3
        with:
          use-installer: true
          # Exact SAM CLI release, not whatever is latest on deploy day.
          version: 1.171.0

      - name: SAM build
        # Every function uses BuildMethod: makefile (apps/api/Makefile), which
        # copies the esbuild bundles from `pnpm build`; no npm install runs.
        run: sam build --template infra/template.yaml

      - name: Upload SAM build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sam-build
          path: .aws-sam/build
          # .aws-sam is a dot directory, which upload-artifact skips by default.
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  deploy:
    needs: build
    if: vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    # The only job that can request the OIDC token. It checks out nothing and
    # installs nothing: pinned actions, the built artifact and `sam deploy`.
    permissions:
      id-token: write
    steps:
      - name: Setup SAM
        uses: aws-actions/setup-sam@341eee193f458fa5aae5d52c94b0c5cf3a1c5a52 # v3
        with:
          use-installer: true
          version: 1.171.0

      - name: Download SAM build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sam-build
          path: .aws-sam/build

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-2

      - name: SAM deploy
        run: |
          sam deploy \
            --template-file .aws-sam/build/template.yaml \
            --stack-name garageborrow-prod \
            --region us-east-2 \
            --resolve-s3 \
            --s3-prefix garageborrow-prod \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset \
            --capabilities CAPABILITY_IAM CAPABILITY_AUTO_EXPAND \
            --parameter-overrides Stage=prod \
              "SiteUrl=${{ vars.SITE_URL }}" \
              "TenantName=${{ vars.TENANT_NAME || 'Garage Borrow' }}" \
              "AppTimezone=${{ vars.APP_TIMEZONE || 'America/New_York' }}"
