name: CI

on:
  pull_request:
  push:
    branches: [main]

# Read-only token by default; jobs that need more ask for it explicitly.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Do not leave the token in .git/config for later steps (deps, Lighthouse).
          persist-credentials: false

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        # vitest covers @axe-core via apps/web's LegalDocument.test.tsx;
        # any new violation on a covered page surfaces here.
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Install Chrome for Lighthouse
        # ubuntu-24.04 runners don't preinstall Chrome. Pinning here so the
        # Lighthouse step has a deterministic browser instead of relying on
        # whatever ships in the runner image.
        uses: browser-actions/setup-chrome@48ad923757ca74d66703209fe939badbdf80f2f4 # v2.2.0
        with:
          chrome-version: stable

      - name: Lighthouse
        # Targets: 90+ Performance / 95+ Accessibility / 95+ Best Practices / 90+ SEO.
        # Thresholds are configured inside scripts/lighthouse.sh.
        run: ./scripts/lighthouse.sh

      - name: Upload Lighthouse report
        # upload-artifact@v4 skips dotfile directories by default; the
        # report lives in .lighthouse/, so include-hidden-files is required.
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lighthouse-report
          path: .lighthouse/
          include-hidden-files: true
          retention-days: 7

  scan-secrets:
    name: Scan for committed secrets
    # Shared job in .github/workflows/gitleaks.yml (pinned gitleaks CLI over the
    # full history). Stays on GitHub-hosted runners in this change; moving to
    # self-hosted labels is a separate, reviewed change.
    permissions:
      contents: read
    uses: ./.github/workflows/gitleaks.yml
    with:
      runs-on: '["ubuntu-latest"]'
      # S4-2: fails if the config stops reporting keys pasted into docs/deploy.md.
      config-test: scripts/gitleaks-config-test.sh

  state-guard:
    name: STATE.md updated with code
    # Repo-state pattern (docs/DECISIONS.md D-011): a PR that changes code paths
    # must update STATE.md unless its title starts with chore or deps.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check STATE.md
        env:
          STATE_GUARD_TITLE: ${{ github.event.pull_request.title }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: ./scripts/state-guard.sh "$BASE_SHA" "$HEAD_SHA"
