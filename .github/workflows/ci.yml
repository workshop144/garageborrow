name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        # vitest covers @axe-core via apps/web's LegalDocument.test.tsx;
        # any new violation on a covered page surfaces here.
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Install Chrome for Lighthouse
        # ubuntu-24.04 runners don't preinstall Chrome. Pinning here so the
        # Lighthouse step has a deterministic browser instead of relying on
        # whatever ships in the runner image.
        uses: browser-actions/setup-chrome@48ad923757ca74d66703209fe939badbdf80f2f4 # v2.2.0
        with:
          chrome-version: stable

      - name: Lighthouse
        # Targets: 90+ Performance / 95+ Accessibility / 95+ Best Practices / 90+ SEO.
        # Thresholds are configured inside scripts/lighthouse.sh.
        run: ./scripts/lighthouse.sh

      - name: Upload Lighthouse report
        # upload-artifact@v4 skips dotfile directories by default; the
        # report lives in .lighthouse/, so include-hidden-files is required.
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: lighthouse-report
          path: .lighthouse/
          include-hidden-files: true
          retention-days: 7

  scan-secrets:
    name: Scan for committed secrets
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # gitleaks-action needs a paid license for organization repos, so run the
      # gitleaks CLI directly (pinned version and checksum) over the full history.
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          curl -sSfL -o gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          sudo mv gitleaks /usr/local/bin/gitleaks
      - name: Scan for secrets
        run: gitleaks git --no-banner --redact --config .gitleaks.toml --exit-code 1 .
