# Dependabot (ADR-089 in workshop144/sublevel): weekly; per ecosystem one PR for minor+patch and
# one for majors, across all its directories. A release must be 3 days old (majors 7 where
# supported). n0's dependabot-merge.py squash-merges a PR once every CI check is green on main's tip.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    commit-message:
      prefix: "chore(deps)"
    groups:
      actions:
        update-types: [minor, patch]
      actions-majors:
        update-types: [major]
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
      semver-major-days: 7
    commit-message:
      prefix: "chore(deps)"
    ignore:
      # TypeScript 7 is the native (Go) compiler and ships no JS compiler API;
      # typescript-eslint 8.x (peer typescript <6.1) parses through that API,
      # so lint cannot run on TS 7. Stay on 6.x until typescript-eslint
      # supports 7 (check its peerDependencies), then drop this entry.
      - dependency-name: typescript
        versions: [">=7"]
    groups:
      npm:
        update-types: [minor, patch]
      npm-majors:
        update-types: [major]
