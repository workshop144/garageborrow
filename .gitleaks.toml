[extend]
useDefault = true

# Allows only the documented example key from docs/deploy.md's push-protection
# check (no default rule matches it today; this keeps it quiet if one ever does).
#
# Do NOT add `paths` here (S4-2). In a global allowlist, paths and regexes are
# ORed, so `paths = ['docs/deploy\.md']` exempted the whole deploy playbook from
# every rule. `condition = "AND"` does not help either: gitleaks 8.30.1 still
# skips every file matching a global allowlist's paths before any rule runs
# (checked 2026-11-06). scripts/gitleaks-config-test.sh fails if a real-shaped
# key in docs/deploy.md stops being reported.
[[allowlists]]
description = "Documented example AWS key (docs/deploy.md)"
regexes = [
  '''AKIA1234567890ABCDEF''',
]
